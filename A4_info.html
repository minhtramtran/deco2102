<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A4 Presentation Room Finder</title>
<style>
:root{--bg:#ffffff;--ink:#1b2333;--muted:#5d677a;--line:#d6dce6;--accent:#23408e;--new:#c00000;--soft:#f3f5f9;--hi:#e6ecf9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Arial,Helvetica,sans-serif;padding:20px max(16px,env(safe-area-inset-left))}
.wrap{max-width:620px}
h1{font-size:20px;margin:0 0 6px}
p.lead{margin:0 0 8px;color:var(--muted)}
p.note{margin:0 0 16px;font-size:14px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--soft)}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:6px}
.combo{position:relative}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
ul{list-style:none;margin:4px 0 0;padding:4px 0;position:absolute;left:0;right:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:6px;max-height:260px;overflow:auto;box-shadow:0 6px 18px rgba(20,30,60,.12)}
li{padding:8px 12px;cursor:pointer}
li[aria-selected="true"],li:hover{background:var(--hi)}
li small{color:var(--muted);margin-left:6px}
li mark{background:none;color:var(--accent);font-weight:bold}
.res{margin-top:16px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--soft)}
.res h2{font-size:17px;margin:0 0 10px}
.res dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
.res dt{color:var(--muted);font-size:14px}
.res dd{margin:0;font-weight:bold}
.new{color:var(--new)} .new a{color:var(--new)}
s{color:var(--muted);font-weight:normal}
.err{margin-top:12px;color:var(--new)}
.small{font-size:13px;color:var(--muted);margin-top:14px}
</style></head>

<div id="out" aria-live="polite"></div>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z ]+/g," ").replace(/\s+/g," ").trim();
const IDX=NAMES.map(([n,i])=>({n,i,k:norm(n),w:norm(n).split(" ")}));
const q=document.getElementById("q"),list=document.getElementById("list"),out=document.getElementById("out");
let hits=[],act=-1;
function match(v){const t=norm(v).split(" ").filter(Boolean);if(!t.length)return[];
  return IDX.filter(o=>t.every(x=>o.w.some(w=>w.startsWith(x)))).slice(0,12)}
function hl(name,v){const t=norm(v).split(" ").filter(Boolean);return name.split(" ").map(w=>{const n=norm(w);const x=t.find(x=>n.startsWith(x));return x?`<mark>${esc(w.slice(0,x.length))}</mark>${esc(w.slice(x.length))}`:esc(w)}).join(" ")}
function showList(){if(!hits.length){list.hidden=true;q.setAttribute("aria-expanded","false");return}
  list.innerHTML=hits.map((o,j)=>`<li role="option" id="o${j}" data-j="${j}" aria-selected="${j===act}">${hl(o.n,q.value)}<small>${esc(SESS[o.i].tut)}</small></li>`).join("");
  list.hidden=false;q.setAttribute("aria-expanded","true");q.setAttribute("aria-activedescendant",act>=0?"o"+act:"")}
function card(o){const s=SESS[o.i];const room=s.link?`<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.room)}</a>`:esc(s.room);

q.addEventListener("keydown",e=>{if(list.hidden)return;
