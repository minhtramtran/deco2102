<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECO2102 Student Experience of Teaching Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #000;
    --paper: #fff;
    --muted: #6b6b6b;
    --dim: #8c8c8c;
    --hover: #f1f1f1;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--paper);
    color: var(--ink);
    font-family:'Patrick Hand', 'Comic Sans MS', cursive;
    font-weight:400;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
    overflow-x:hidden;
  }

  /* hand-drawn outlines are SVGs drawn by rough.js and tucked inside their host */
  .sk{ position:absolute; left:0; top:0; z-index:0; pointer-events:none; overflow:visible; }

  /* plain CSS lines, only used if rough.js could not load */
  .no-rough .tablet{ border: 2px solid var(--ink); }
  .no-rough .pl-panel{ border-right: 1.5px solid var(--ink); }
  @media (max-width: 700px){ .no-rough .pl-panel{ border-right:none; border-top: 1.5px solid var(--ink); } }
  .no-rough .np-play{ border: 1.8px solid var(--ink); }
  .no-rough .cta-button{ border: 2px solid var(--ink); }
  .no-rough .pl-item[aria-current="true"]{ border: 1.5px solid var(--ink); }
    .no-rough .np-progress::before{ content:''; position:absolute; left:0; right:0; top:50%; border-top: 1.6px solid var(--ink); }
  .no-rough .lyrics .w.now{ text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }

  /* ---------- tablet ---------- */
  .tablet{
    position:relative;
    width:100%;
    max-width: 1000px;
    border-radius: 26px;
    padding: 48px 46px 44px 46px;
  }

  .tablet-screen{
    display:grid;
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
    height: 630px;
  }

  /* ---------- left: playlist ---------- */
  .pl-panel{
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding-right: 18px;
  }

  .panel-head{
    font-weight:400;
    font-size: 26px;
    line-height:1.1;
    margin: 0 0 18px 0;
    padding: 0 10px;
    -webkit-text-stroke: 0.6px var(--ink);
  }


  .pl-list{
    list-style:none;
    margin:0;
    padding: 4px 12px 12px 6px;
    overflow-y:auto;
    flex:1;
    position:relative;
  }

  .pl-item{
    position:relative;
    width:100%;
    display:flex;
    gap:12px;
    align-items:baseline;
    text-align:left;
    font-family:inherit;
    font-weight:400;
    font-size:18px;
    line-height:1.2;
    padding: 8px 10px 9px 10px;
    border:none;
    background:transparent;
    color: var(--ink);
    border-radius: 8px;
    cursor:pointer;
  }

  .pl-item .name{ text-transform:lowercase; }
  .np-title, .response-big, .response-note, .response-last, .cta-button, .play-label, .cover text{ text-transform:lowercase; }
  .panel-head{ text-transform:lowercase; }
  .pl-item > span{ position:relative; z-index:1; }
  .pl-item .num{ width:26px; flex-shrink:0; color: var(--muted); letter-spacing:0.04em; }
  .pl-item:hover{ background: var(--hover); }
  .pl-item[aria-current="true"]{ background: transparent; }
  /* the survey track stands out with the University of Sydney red */
  .pl-item.survey{ background:#E64626; color:#fff; margin-top:6px; align-items:center; font-size:18px; padding:9px 12px 10px 16px; gap:8px; }
  .pl-item.survey .num{ display:none; }
  .pl-item.survey:hover{ background:#d63d1f; }
  .pl-item.survey[aria-current="true"]{ background:#E64626; }
  .pl-item .go{ margin-left:auto; flex-shrink:0; width:22px; height:22px; display:inline-flex; }
  .pl-item .go svg{ width:100%; height:100%; }
  .pl-item:focus-visible{ outline: 2px solid var(--ink); outline-offset:1px; }

  /* ---------- right: now playing ---------- */
  .np-panel{
    display:flex;
    flex-direction:column;
    padding: 0 6px 0 36px;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
  }

  .np-top{
    display:flex;
    flex-wrap:wrap;
    gap: 14px 20px;
    align-items:flex-start;
  }

  .cover{
    flex: 0 0 160px;
    width:160px;
    height:160px;
  }
  .cover svg{ width:100%; height:100%; display:block; overflow:visible; }

  .record{ transform-box: fill-box; transform-origin:center; }
  @media (prefers-reduced-motion: no-preference){
    .record.spinning{ animation: spin 1.8s linear infinite; }
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .np-meta{ flex: 1 1 190px; min-width:0; padding-top: 2px; }

  .np-label{
    font-size:11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .np-title{
    font-weight:400;
    font-size: 25px;
    line-height:1.1;
    margin: 4px 0 12px 0;
    -webkit-text-stroke: 0.6px var(--ink);
  }

  .np-num{ margin-right: 10px; }
  .np-num:empty{ display:none; }

  /* thin line with a knob, like a scrubber */
  .np-progress{
    position:relative;
    height: 28px;
    margin: 0 18px;
  }
  .np-progress i{
    position:absolute;
    left:0; top:50%;
    width:32px; height:26px;
    margin: -13px 0 0 -16px;
    transition: left 0.2s linear;
    z-index:1;
  }

  /* karaoke: grey = coming up, black = sung, underlined = singing now */
  .lyrics{
    font-size: 22px;
    line-height:1.5;
    margin: 16px 0 0 0;
    color: var(--dim);
  }

  .lyrics .w{ position:relative; transition: color 0.15s ease; }
  .lyrics .w.sung, .lyrics .w.now{ color: var(--ink); }
  .lyrics.static .w{ color: var(--ink); }

  /* response tracker (shown on the survey track) */
  .response{ margin-top:28px; }
  .response + .controls{ margin-top:18px; }
  .response[hidden]{ display:none; }
  .response-nums{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .response-big{ font-size:30px; line-height:1.1; color:#E64626; }
  .response-note{ font-size:17px; color: var(--muted); }
  .response-bar{ position:relative; height:16px; margin-top:8px; }
  .response-bar i{ position:absolute; left:4px; top:4px; bottom:4px; background:#E64626; border-radius:4px; z-index:1; }
  .response-bar .response-mark{ position:absolute; top:-3px; bottom:-3px; width:0; border-left:2px solid #E64626; z-index:2; }
  .response-last{ position:relative; height:24px; margin-top:6px; font-size:17px; color: var(--muted); }
  .response-last span{ position:absolute; top:0; transform:translateX(-50%); white-space:nowrap; }

  /* controls */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap: 16px;
    margin-top: 30px;
  }

  .np-play{
    position:relative;
    width:50px; height:50px;
    padding:0;
    border:none;
    border-radius:50%;
    background: transparent;
    color: var(--ink);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  .play-group{ display:inline-flex; align-items:center; gap:12px; }
  .play-label{ font-size:20px; line-height:1; cursor:pointer; user-select:none; }
  .np-play .icon{ position:relative; z-index:1; display:inline-flex; }
  .np-play .icon svg{ width:20px; height:20px; display:block; }
  .np-play:hover{ background: var(--hover); }

  .cta-button[hidden]{ display:none; }
  .cta-button{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:inherit;
    font-size:21px;
    line-height:1.2;
    color: var(--ink);
    text-decoration:none;
    padding: 7px 18px 9px 20px;
    border-radius:13px;
    background: transparent;
  }

  .cta-button > *:not(.sk){ position:relative; z-index:1; }
  .cta-button .arrow{ width:20px; height:20px; display:block; }
  .cta-button:hover{ background: var(--hover); }

  .np-play:focus-visible, .cta-button:focus-visible{ outline: 2px solid var(--ink); outline-offset:3px; }

  /* ---------- phones: stack the panels, now-playing first ---------- */
  /* narrower embeds: smaller cover so it still sits beside the title */
  @media (min-width: 701px) and (max-width: 940px){
    .cover{ flex-basis:120px; width:120px; height:120px; }
  }

  @media (max-width: 700px){
    body{ padding: 20px 12px; }
    .tablet{ padding: 38px 22px 28px 22px; border-radius: 22px; }
    .tablet-screen{ grid-template-columns: 1fr; height:auto; }
    .np-panel{ order:-1; padding: 0 2px 18px 2px; min-height: 380px; }
    .pl-panel{ padding: 18px 0 0 0; max-height: 380px; }
    .cover{ flex-basis:120px; width:120px; height:120px; }
    .np-title{ font-size: 23px; }
    .lyrics{ font-size: 20px; }
  }
</style>
</head>
<body>

<main class="tablet" id="tablet" aria-label="DECO2102 Student Experience of Teaching Survey">
  <div class="tablet-screen">

    <section class="pl-panel" id="plPanel" aria-labelledby="plTitle">
      <h1 class="panel-head" id="plTitle">The playlist</h1>
      <ol class="pl-list" id="plList"></ol>
    </section>

    <section class="np-panel" aria-label="Now playing">
      <div class="np-top">
        <div class="cover" id="cover">
          <svg id="coverSvg" viewBox="0 0 200 200" role="img" aria-label="Hand-drawn album cover for the current track"></svg>
        </div>
        <div class="np-meta">
          <div class="np-label" id="npLabel">now playing</div>
          <h2 class="np-title"><span class="np-num" id="npNum">01</span><span id="npTitle"></span></h2>
          <div class="np-progress" id="npProgress" aria-hidden="true"><i id="npBar"></i></div>
        </div>
      </div>

      <p class="lyrics static" id="lyrics"></p>

      <div class="response" id="response" hidden>
        <div class="response-nums"><span class="response-big" id="respBig"></span><span class="response-note" id="respNote"></span></div>
        <div class="response-bar" id="respBar"><i id="respFill"></i><b class="response-mark" id="respMark"></b></div>
        <div class="response-last" id="respLast"></div>
      </div>

      <div class="controls">
        <div class="play-group"><button class="np-play" id="npPlay" type="button" aria-label="Play"><span class="icon" id="npIcon"></span></button><span class="play-label" id="npPlayLabel" aria-hidden="true">Play</span></div>
        <a href="#" class="cta-button" id="survey-link" target="_blank" rel="noopener noreferrer"><span>Take the survey</span><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5 H20 M14 6 L20.5 12.5 L14 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
    </section>

  </div>
</main>

<script>
  // ---------------------------------------------------------------------
  // PLACEHOLDER LINK — replace with your real survey URL before sharing.
  // ---------------------------------------------------------------------
  const SURVEY_URL = "https://students-say.sydney.edu.au/";

  // ---------------------------------------------------------------------
  // RESPONSE RATE — update these two numbers whenever you want.
  // ---------------------------------------------------------------------
  const RESPONSES_SO_FAR = 58;     // how many students have responded
  const TOTAL_STUDENTS   = 285;    // how many students were invited
  const LAST_YEAR        = 101;    // responses we got last year (shown as a marker on the bar)
  document.getElementById("survey-link").href = SURVEY_URL;

  // ---------------------------------------------------------------------
  // Lo-fi Chill beat engine — original synthesized audio.
  // No external audio file, no copyright.
  // ---------------------------------------------------------------------
  const styles = {
    lofi: {
      bpm: 90,
      waveType: "sine",
      pattern: [
        { kick:true,  hat:false, snare:false, note:261.63 },
        { kick:false, hat:false, snare:false, note:null },
        { kick:false, hat:true,  snare:false, note:329.63 },
        { kick:false, hat:false, snare:false, note:null },
        { kick:false, hat:false, snare:true,  note:392.00 },
        { kick:false, hat:true,  snare:false, note:null },
        { kick:false, hat:false, snare:false, note:329.63 },
        { kick:false, hat:true,  snare:false, note:null },
      ]
    }
  };

  let currentStyleKey = "lofi"; // Lo-fi is the default

  let audioCtx;
  let isPlaying = false;
  let stepIndex = 0;
  let stepTimer;
  let noiseBuffer;

  function createNoiseBuffer(){
    const size = audioCtx.sampleRate * 0.3;
    const buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<size;i++){ data[i] = Math.random()*2 - 1; }
    return buffer;
  }

  function playKick(){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(42, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }

  function playHat(){
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 7000;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start();
    src.stop(audioCtx.currentTime + 0.06);
  }

  function playSnare(){
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1800;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start();
    src.stop(audioCtx.currentTime + 0.16);
  }

  function playMelodyNote(freq, waveType){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = waveType || "triangle";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.16, audioCtx.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.24);
  }

  function pulse(el, scale, duration){
    if(!el || !el.animate) return;
    el.animate(
      [{ transform:"scale(1)" }, { transform:`scale(${scale})` }, { transform:"scale(1)" }],
      { duration, easing:"ease-out" }
    );
  }

  function scheduleStep(){
    if(!isPlaying) return;
    const style = styles[currentStyleKey];
    const step = style.pattern[stepIndex % style.pattern.length];
    if(step.kick){ playKick(); pulse(coverEl, 1.03, 160); }
    if(step.hat) playHat();
    if(step.snare){ playSnare(); pulse(document.querySelector(".cta-button"), 1.05, 160); }
    if(step.note) playMelodyNote(step.note, style.waveType);
    stepIndex++;
    onBeat();
    const stepDuration = 60 / style.bpm / 2;
    stepTimer = setTimeout(scheduleStep, stepDuration * 1000);
  }


  // ---------------------------------------------------------------------
  // PLAYLIST + KARAOKE — edit titles and summaries here.
  // One word lights up per beat of the Lo-fi Chill track.
  // ---------------------------------------------------------------------
  const tracks = [
    { title: "Introduction to Interface Design", summary: "What makes something an interface is the role it plays in connecting a person with a system and supporting a task." },
    { title: "Human-Centred Design", summary: "Design choices depend on people, tasks and environments. Synthetic users? It depends." },
    { title: "Iteration & Critique", summary: "Iteration: the next version should be informed by what you learnt from the previous one." },
    { title: "Layout & Hierarchy", summary: "Structure a screen so it is easy to read. Layout and hierarchy show people what matters first." },
    { title: "Information Architecture", summary: "Help users find their way through a product. Clear structure and navigation tell people where they are and where to go next." },
    { title: "Visual Language", summary: "Colour, typography and iconography work together as a visual language that gives an interface its clarity and personality." },
    { title: "Design Systems", summary: "Make consistency repeatable at scale. Shared components and rules keep a product coherent as it grows." },
    { title: "AI × Interface Design", summary: "Tools come and go. Being good at design is not just about the tools you use. How you think is forever." },
    { title: "Design Drop-In / Figma Nights", summary: "Well, practice makes perfect." },
    { title: "Usability Testing", summary: "Learn whether a design actually works by watching real people use it. Test, find the problems, then fix them." },
    { title: "Universal Usability", summary: "Design for every kind of user. Thinking about accessibility from the start means more people can use what you make." },
    { title: "Industry Insights", summary: "Companies and the design industry are evolving, but relevant skills persist, including communication, advocating for design decisions, openness to feedback, adaptability and stakeholder management." },
    { title: "No Lecture", summary: "Sleep-in and proper breakfast." },
    { title: "Give feedback on DECO2102", summary: "Tell us what worked, what didn't, and what we should change next time." }
  ];

  // ---------------------------------------------------------------------
  // HAND-DRAWN LINES — thin wobbly outlines drawn with rough.js and tucked
  // inside their host element. Without rough.js the CSS falls back to plain lines.
  // ---------------------------------------------------------------------
  const INK = "#000";
  const NS = "http://www.w3.org/2000/svg";
  const HAS_ROUGH = true;   // our own single-stroke sketcher, no library needed

  // One continuous wobbly stroke per shape (no doubled "sketchy" passes).
  function makeRc(){
    const mk = (d, o) => {
      const el = document.createElementNS(NS, "path");
      el.setAttribute("d", d);
      el.setAttribute("fill", o.fill || "none");
      el.setAttribute("stroke", o.stroke || INK);
      el.setAttribute("stroke-width", o.strokeWidth || 1.5);
      el.setAttribute("stroke-linecap", "round");
      el.setAttribute("stroke-linejoin", "round");
      return el;
    };
    const rng = seed => { let a = (seed || 1) * 2654435761 >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
    // smooth curve through points (Catmull-Rom -> cubic Bezier)
    const smooth = (pts, closed) => {
      const n = pts.length, P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
      let d = "M" + pts[0][0].toFixed(1) + "," + pts[0][1].toFixed(1);
      const last = closed ? n : n - 1;
      for(let i = 0; i < last; i++){
        const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
        d += " C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + "," + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) +
             " " + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + "," + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) +
             " " + p2[0].toFixed(1) + "," + p2[1].toFixed(1);
      }
      return d + (closed ? " Z" : "");
    };
    const along = (x1, y1, x2, y2, amp, r, step, calm) => {
      const len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(2, Math.round(len / step));
      const nx = -(y2 - y1) / (len || 1), ny = (x2 - x1) / (len || 1), out = [];
      for(let i = 0; i <= n; i++){
        const t = i / n, j = (r() - 0.5) * 2 * amp * ((i === 0 || i === n) && calm ? 0 : 1);
        out.push([x1 + (x2 - x1) * t + nx * j, y1 + (y2 - y1) * t + ny * j]);
      }
      return out;
    };
    return {
      line(x1, y1, x2, y2, o){
        const r = rng(o.seed);
        return mk(smooth(along(x1, y1, x2, y2, (o.roughness || 0.5) * 0.9, r, 26), false), o);
      },
      circle(cx, cy, d, o){
        const r = rng(o.seed), rad = d / 2, amp = (o.roughness || 0.8) * 0.5;
        const n = Math.max(8, Math.min(36, Math.round(Math.PI * d / 9))), pts = [];
        const rot = r() * 6.28;
        for(let i = 0; i < n; i++){
          const a = rot + i / n * 6.2832, rr = rad + (r() - 0.5) * 2 * amp;
          pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
        }
        return mk(smooth(pts, true), o);
      },
      rrect(x, y, w, h, rad, o){
        const r = rng(o.seed), amp = (o.roughness || 0.8) * (h < 80 ? 0.35 : 0.8), pts = [];
        const edge = (ax, ay, bx, by) => { const e = along(ax, ay, bx, by, amp, r, 34, true); e.pop(); return e; };
        const arc = (cx, cy, a0) => { const e = []; for(let k = 1; k < 3; k++){ const a = a0 + k * Math.PI / 6; e.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]); } return e; };
        pts.push(...edge(x + rad, y, x + w - rad, y), ...arc(x + w - rad, y + rad, -Math.PI / 2));
        pts.push(...edge(x + w, y + rad, x + w, y + h - rad), ...arc(x + w - rad, y + h - rad, 0));
        pts.push(...edge(x + w - rad, y + h, x + rad, y + h), ...arc(x + rad, y + h - rad, Math.PI / 2));
        pts.push(...edge(x, y + h - rad, x, y + rad), ...arc(x + rad, y + rad, Math.PI));
        return mk(smooth(pts, true), o);
      },
      rectangle(x, y, w, h, o){ return this.rrect(x, y, w, h, 6, o); }
    };
  }

  function roundedRectPath(x, y, w, h, r){
    return `M${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x+r},${y+h} Q${x},${y+h} ${x},${y+h-r} L${x},${y+r} Q${x},${y} ${x+r},${y} Z`;
  }

  const sketches = new Map();   // host element -> { svg, draw }
  function paintSketch(el){
    const rec = sketches.get(el);
    if(!rec) return;
    const w = el.offsetWidth, h = el.offsetHeight;
    if(!w || !h) return;
    const svg = rec.svg;
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.textContent = "";
    const rc = makeRc();
    rec.draw(rc, w, h).forEach(n => svg.appendChild(n));
  }
  const sketchWatcher = (typeof ResizeObserver !== "undefined")
    ? new ResizeObserver(entries => entries.forEach(e => paintSketch(e.target)))
    : null;

  function unsketch(el){
    const rec = sketches.get(el);
    if(!rec) return;
    rec.svg.remove();
    sketches.delete(el);
    if(sketchWatcher) sketchWatcher.unobserve(el);
  }
  function sketch(el, draw){
    if(!HAS_ROUGH || !el) return;
    unsketch(el);
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "sk");
    svg.setAttribute("aria-hidden", "true");
    el.insertBefore(svg, el.firstChild);
    sketches.set(el, { svg, draw });
    paintSketch(el);
    if(sketchWatcher) sketchWatcher.observe(el);
  }

  const coverSvg = document.getElementById("coverSvg");

  const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.2 L19 12 L8.5 18.8 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 V18.5 M16 5.5 V18.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>';
  npIcon.innerHTML = ICON_PLAY;
  document.getElementById("npPlayLabel").addEventListener("click", () => npPlay.click());

  let trackIndex = 0;
  let wordEls = [];
  let wordIndex = -1;     // the word being sung right now (-1 = not started)
  let sweeping = false;   // false = whole summary shown in plain ink
  let holdBeats = 0;      // beats to linger once a summary has finished
  let atEnd = false;      // true once the last track has played out
  let underlined = null;  // the word that currently has the hand-drawn underline

  tracks.forEach((t, i) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pl-item";
    btn.innerHTML = '<span class="num"></span><span class="name"></span>';
    btn.querySelector(".num").textContent = i === tracks.length - 1 ? "" : String(i + 1).padStart(2, "0");
    if(i === tracks.length - 1){
      btn.classList.add("survey");
      btn.insertAdjacentHTML("beforeend", '<span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12.5 H20 M14 6 L20.5 12.5 L14 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>');
    }
    btn.querySelector(".name").textContent = t.title;
    btn.addEventListener("click", () => selectTrack(i));
    li.appendChild(btn);
    plList.appendChild(li);
  });
  const plButtons = plList.querySelectorAll(".pl-item");

  // static frames and controls
  sketch(document.getElementById("tablet"), (rc, w, h) => [
    rc.rrect(3, 3, w - 6, h - 6, 26, { stroke:INK, strokeWidth:1.8, roughness:0.8, seed:7 }),
    rc.circle(w / 2, 16, 6, { stroke:INK, strokeWidth:1.3, roughness:0.4, seed:2 })
  ]);
  sketch(document.getElementById("plPanel"), (rc, w, h) => {
    const stacked = window.matchMedia && window.matchMedia("(max-width: 700px)").matches;
    const opts = { stroke:INK, strokeWidth:1.4, roughness:0.5, seed:3 };
    // side by side: a line down the middle. stacked on phones: a line above the playlist.
    return [stacked ? rc.line(4, 2, w - 4, 2, opts) : rc.line(w - 1, 4, w - 1, h - 4, opts)];
  });
  // the koala is the knob of the scrubber
  sketch(document.getElementById("npBar"), (rc, w, h) => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("transform", "scale(" + (w / 44) + ")");
    koalaNodes(rc, 1.1).forEach(n => g.appendChild(n));
    return [g];
  });
  sketch(document.getElementById("npProgress"), (rc, w, h) => [
    rc.line(1, h / 2, w - 1, h / 2, { stroke:INK, strokeWidth:1.5, roughness:0.5, seed:5 })
  ]);
  sketch(npPlay, (rc, w, h) => [
    rc.circle(w / 2, h / 2, w - 5, { stroke:INK, strokeWidth:1.7, roughness:0.8, seed:11 })
  ]);
  sketch(document.getElementById("survey-link"), (rc, w, h) => [
    rc.rrect(3, 3, w - 6, h - 6, 13, { stroke:INK, strokeWidth:1.9, roughness:0.8, seed:13 })
  ]);

  // hand-sketched record sleeve, thin black line only (rough.js, with a plain-SVG fallback)
  function applySpin(){
    const rec = coverSvg.querySelector(".record");
    if(rec) rec.classList.toggle("spinning", isPlaying);
  }

  // A hand-drawn koala head, drawn in a 44 x 36 box (sw scales the line weight)
  function koalaNodes(rc, sw){
    return [
      rc.circle(9, 11, 16, { stroke:INK, strokeWidth:1.4 * sw, roughness:0.4, seed:51 }),
      rc.circle(35, 11, 16, { stroke:INK, strokeWidth:1.4 * sw, roughness:0.4, seed:52 }),
      rc.circle(9, 11, 7, { stroke:INK, strokeWidth:1.1 * sw, roughness:0.3, seed:53 }),
      rc.circle(35, 11, 7, { stroke:INK, strokeWidth:1.1 * sw, roughness:0.3, seed:54 }),
      rc.rrect(6, 8, 32, 27, 13, { stroke:INK, fill:"#fff", strokeWidth:1.5 * sw, roughness:0.5, seed:55 }),
      rc.circle(15.5, 19, 3.4, { stroke:INK, fill:INK, strokeWidth:1 * sw, roughness:0.2, seed:56 }),
      rc.circle(28.5, 19, 3.4, { stroke:INK, fill:INK, strokeWidth:1 * sw, roughness:0.2, seed:57 }),
      rc.circle(22, 25, 9, { stroke:INK, fill:INK, strokeWidth:1 * sw, roughness:0.3, seed:58 })
    ];
  }

  function drawCover(i){
    const rc = makeRc();
    coverSvg.textContent = "";

    const plain = (tag, attrs) => {
      const el = document.createElementNS(NS, tag);
      for(const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    };
    const rect = (x, y, w, h, sw) => rc
      ? rc.rectangle(x, y, w, h, { stroke:INK, strokeWidth:sw, roughness:0.8, seed:21 })
      : plain("rect", { x, y, width:w, height:h, rx:8, fill:"none", stroke:INK, "stroke-width":sw });
    const circle = (cx, cy, d, sw, rgh, solid) => rc
      ? rc.circle(cx, cy, d, Object.assign({ stroke:INK, strokeWidth:sw, roughness: rgh || 0.8, seed:22 }, solid ? { fill:INK, fillStyle:"solid" } : {}))
      : plain("circle", { cx, cy, r:d/2, fill: solid ? INK : "none", stroke:INK, "stroke-width":sw });
    const line = (x1, y1, x2, y2, sw) => rc
      ? rc.line(x1, y1, x2, y2, { stroke:INK, strokeWidth:sw, roughness:0.5, seed:23 })
      : plain("line", { x1, y1, x2, y2, stroke:INK, "stroke-width":sw, "stroke-linecap":"round" });
    const label = (x, y, str, size, anchor) => {
      const t = plain("text", { x, y, "text-anchor":anchor, "font-family":"'Patrick Hand', cursive", "font-size":size, fill:INK });
      t.textContent = str;
      return t;
    };

    if(COVER_ART[i]){
      const img = plain("image", { x:5, y:5, width:190, height:190, preserveAspectRatio:"xMidYMid slice" });
      img.setAttribute("href", COVER_ART[i]);
      coverSvg.appendChild(img);
      coverSvg.appendChild(rect(5, 5, 190, 190, 1.9));
      return;
    }
    coverSvg.appendChild(rect(5, 5, 190, 190, 1.9));

    const rec = plain("g", { "class":"record" });
    rec.appendChild(circle(100, 108, 128, 1.8));
    rec.appendChild(circle(100, 108, 104, 1, 1.6));
    rec.appendChild(circle(100, 108, 82, 1, 1.6));
    rec.appendChild(circle(100, 108, 48, 1.5));
    rec.appendChild(line(100, 86, 100, 97, 2));       // a notch on the label, so the spin is visible
    rec.appendChild(circle(100, 108, 8, 1, 0.6, true));
    coverSvg.appendChild(rec);

    if(i !== tracks.length - 1) coverSvg.appendChild(label(16, 34, String(i + 1).padStart(2, "0"), 26, "start"));
    coverSvg.appendChild(label(186, 28, "DECO2102", 15, "end"));
    applySpin();
  }

  function paintLyrics(){
    lyricsEl.classList.toggle("static", !sweeping);
    wordEls.forEach((el, k) => {
      el.classList.toggle("sung", sweeping && k < wordIndex);
      el.classList.toggle("now", sweeping && k === wordIndex);
    });

    // hand-drawn underline travels with the word being sung
    const nowEl = sweeping ? wordEls[wordIndex] : null;
    if(underlined && underlined !== nowEl){ unsketch(underlined); underlined = null; }
    if(nowEl && underlined !== nowEl){
      const sd = wordIndex + 1;
      sketch(nowEl, (rc, w, h) => [
        rc.line(-2, h - 1, w + 2, h - 3, { stroke:INK, strokeWidth:1.8, roughness:0.9, seed:sd })
      ]);
      underlined = nowEl;
    }

    const pct = sweeping ? Math.min(1, (wordIndex + 1) / wordEls.length) * 100 : 0;
    npBar.style.left = pct + "%";
  }

  function paintResponse(){
    const done = RESPONSES_SO_FAR, total = TOTAL_STUDENTS;
    const pct = total > 0 ? Math.min(100, Math.max(0, done / total * 100)) : 0;
    document.getElementById("respBig").textContent = done + " / " + total;
    document.getElementById("respNote").textContent = "responses so far \u00b7 " + Math.round(pct) + "%";
    document.getElementById("respFill").style.width = "calc((100% - 8px) * " + (pct / 100) + ")";
    const lp = total > 0 ? Math.min(100, LAST_YEAR / total * 100) : 0;
    const pos = "calc(4px + (100% - 8px) * " + (lp / 100) + ")";
    document.getElementById("respMark").style.left = pos;
    const togo = LAST_YEAR - done;
    const last = document.getElementById("respLast");
    last.textContent = "";
    const tag = document.createElement("span");
    tag.style.left = pos;
    tag.textContent = togo > 0 ? "last year: " + LAST_YEAR + " \u00b7 " + togo + " to go" : "last year: " + LAST_YEAR + " \u00b7 beaten!";
    last.appendChild(tag);
  }
  paintResponse();
  sketch(document.getElementById("respBar"), (rc, w, h) => [
    rc.rrect(2, 2, w - 4, h - 4, 6, { stroke:INK, strokeWidth:1.4, roughness:0.6, seed:41 })
  ]);

  function selectTrack(i){
    trackIndex = i;
    document.getElementById("response").hidden = (i !== tracks.length - 1);
    const t = tracks[i];
    document.getElementById("survey-link").hidden = (i !== tracks.length - 1);
    npNum.textContent = i === tracks.length - 1 ? "" : String(i + 1).padStart(2, "0");
    npTitle.textContent = t.title;
    npLabel.textContent = i === tracks.length - 1 ? "bonus track" : "now playing";
    drawCover(i);

    if(underlined){ unsketch(underlined); underlined = null; }
    lyricsEl.textContent = "";
    const words = t.summary.split(" ");
    wordEls = words.map((w, k) => {
      const span = document.createElement("span");
      span.className = "w";
      span.textContent = w;
      lyricsEl.appendChild(span);
      if(k < words.length - 1) lyricsEl.appendChild(document.createTextNode(" "));
      return span;
    });

    plButtons.forEach((b, k) => {
      b.setAttribute("aria-current", k === i ? "true" : "false");
      const isSurvey = b.classList.contains("survey");
      if(k === i && !isSurvey){
        sketch(b, (rc, w, h) => [
          rc.rrect(4, 4, w - 8, h - 8, 9, { stroke:INK, strokeWidth:1.5, roughness:0.8, seed:30 + k })
        ]);
      } else {
        unsketch(b);
      }
    });
    const cur = plButtons[i];
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    plList.scrollTo({
      top: Math.max(0, cur.offsetTop - plList.clientHeight / 2 + cur.offsetHeight / 2),
      behavior: reduce ? "auto" : "smooth"
    });

    wordIndex = -1;
    holdBeats = 0;
    atEnd = false;
    sweeping = isPlaying;   // playing: sweep from the first word. paused: show it plainly.
    paintLyrics();
  }

  // called once per beat from the beat engine
  function onBeat(){
    if(!sweeping) return;
    if(wordIndex < wordEls.length){
      wordIndex++;
      paintLyrics();
      return;
    }
    holdBeats++;
    if(holdBeats >= 6){
      if(trackIndex < tracks.length - 1){
        selectTrack(trackIndex + 1);
      } else {
        atEnd = true;
        setPlaying(false);
      }
    }
  }

  function setPlaying(next){
    if(next === isPlaying) return;
    if(next && !audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuffer = createNoiseBuffer();
    }
    isPlaying = next;
    npIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
    npPlay.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
    document.getElementById("npPlayLabel").textContent = isPlaying ? "Pause" : "Play";
    applySpin();

    if(isPlaying){
      if(audioCtx.state === "suspended") audioCtx.resume();
      if(atEnd){
        selectTrack(0);       // the tape ran out: start again from track 1
      } else if(!sweeping){
        sweeping = true;      // start the karaoke from the first word
        wordIndex = -1;
        holdBeats = 0;
        paintLyrics();
      }
      scheduleStep();
    } else {
      clearTimeout(stepTimer);
    }
  }

  npPlay.addEventListener("click", () => setPlaying(!isPlaying));

  selectTrack(0);
</script>

</body>
</html>
